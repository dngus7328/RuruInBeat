window.auditSong=function(i){let d=data[i],r=ensure(d),canvas=document.createElement("canvas"),cols=10,rows=10,tw=240,th=116;canvas.width=cols*tw;canvas.height=rows*(th+14);let c=canvas.getContext("2d"),stats={frames:0,peak:0,lower:0,hiddenFrames:0,maxHidden:0,routeHits:r.hits},sheets=[],worst=[];for(let k=0;k<=Math.ceil(d.duration*10);k++){let t=k/10,m=frame(i,t);stats.frames++;stats.peak=Math.max(stats.peak,m.count);stats.lower+=m.lower?1:0;stats.hiddenFrames+=m.hidden>0?1:0;stats.maxHidden=Math.max(stats.maxHidden,m.hidden);let ix=k%100;if(ix===0){c.fillStyle="#17151e";c.fillRect(0,0,canvas.width,canvas.height)}let x=ix%cols*tw,y=Math.floor(ix/cols)*(th+14);c.drawImage($("stage"),x,y,tw,th);c.fillStyle="#fff";c.font="11px sans-serif";c.fillText(t.toFixed(1)+"s · "+m.count+"N "+m.bullets+"B",x+3,y+th+11);if(ix===99||k===Math.ceil(d.duration*10))sheets.push(canvas.toDataURL("image/jpeg",.78));let score=m.hidden*3+m.bullets*.25+m.count+(m.wheel?2:0);worst.push([score,t,m.wheel]);}worst.sort((a,b)=>b[0]-a[0]);let samples=[];for(let x of worst){if(samples.every(t=>Math.abs(t-x[1])>2))samples.push(x[1]);if(samples.length===5)break}return {stats,sheets,samples}};
window.drawAt=(i,t)=>frame(i,t);window.songData=data;select(0);requestAnimationFrame(loop);
</script></html>
