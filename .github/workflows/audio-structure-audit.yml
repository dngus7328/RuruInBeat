name: Audio-informed chart review
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Tools/ChartRework/**'
      - 'Assets/MouseMode/ChartSystem/Charts/**'
      - 'Assets/Song/**'
      - '.github/workflows/audio-structure-audit.yml'

permissions:
  contents: read

jobs:
  audit-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install audio decoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Extract audio-derived section and onset candidates
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/ChartRework/audio_structure_audit.py | tee audio_audit.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-structure-report
          path: audio_audit.log
          if-no-files-found: warn
