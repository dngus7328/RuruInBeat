name: Unity Editor checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: Unity 2022.3 EditMode tests
    # Keep CI dormant until the repository owner has configured Unity
    # credentials. GitHub Settings > Secrets and variables > Actions >
    # Variables > UNITY_CI_ENABLED = true.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out full Unity project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify project structure
        shell: bash
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Assets/Scene/Mouse.unity
          test -f Assets/Scene/SongSelectScene.unity

      - name: Run Unity Editor tests and compile scripts
        id: unity_tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts

      - name: Upload Unity test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
